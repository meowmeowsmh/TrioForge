services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: trio-forge
    ports:
      # Host 5001 can be taken by a stale WSL port-relay. Use host 5002 to
      # avoid the "address already in use" collision; the app still listens
      # on 5001 inside the container.
      #
      # SECURITY: this publishes the app on every interface of this machine, and a
      # container has no login unless you set TRIOFORGE_PASSWORD below. Publish only
      # to yourself with "127.0.0.1:5002:5001" if nobody else should reach it.
      - "5002:5001"
    extra_hosts:
      # Makes "host.docker.internal" resolve on native Linux Docker Engine
      # too (Docker Desktop on Mac/Windows/WSL2 already provides this
      # mapping automatically, so this line is harmless there).
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist conversations, notes, cork board data (JSON)
      - ../json_configuration:/app/json_configuration
      # Share the SAME SQLite databases as the native app so your chats/notes
      # are identical in Docker and on the host (bind mount, not a separate
      # volume — a named volume was previously creating an empty, divergent DB).
      - ../sqlite_data:/app/sqlite_data
      # Persist uploaded images / attachments
      - ../static/uploads:/app/static/uploads
      # (optional) keep certs if you ever generate them
      - ../cert_store:/app/cert_store
      # Mount the model folders so the app can see your GGUF models, and any
      # ComfyUI workflows you keep inside the project. Remove these lines if you
      # load models only through the host llama-server (remote mode below).
      - ../models:/app/models
      - ../video_model:/app/video_model
      - ../universal_models_to_text:/app/universal_models_to_text
      # Server logs (logs/server.log, logs/llamacpp.log) — handy for diagnosing
      # a llama.cpp/model failure without exec-ing into the container.
      - ../logs:/app/logs
    environment:
      # Point to Ollama – if you run Ollama on the host, use "host.docker.internal" (mac/win)
      # or the IP of your host (Linux: use --add-host or set to your host IP)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # Suppress Python warnings (like the pynvml deprecation notice)
      - PYTHONWARNINGS=ignore
      # A container must listen on 0.0.0.0 for the published port to reach it, which
      # means anyone who can route to this machine gets in unless you set a password.
      # Uncomment the next line and choose your own password to require a login:
      # - TRIOFORGE_PASSWORD=change-me
      - TRIOFORGE_HOST=0.0.0.0
      # Serve plain HTTP on localhost (no scary "not secure" browser warning;
      # localhost is a secure context). Set TRIOFORGE_SSL=1 and mount a trusted
      # cert_store/ if you want HTTPS instead.
      - TRIOFORGE_SSL=0
      # Internal gunicorn port — keep in sync with the `ports:` mapping above.
      # Change both to e.g. 5003 to match the native app.
      - TRIOFORGE_PORT=5001
      # Gunicorn worker count. Keep it low: SQLite writes are only guarded
      # per-process, so many workers can cause "database is locked".
      - TRIOFORGE_WORKERS=2
      # ── llama.cpp ─────────────────────────────────────────────────────────
      # The image does NOT ship llama-server (it's a GPU service). Run it ON THE
      # HOST and point the container at it. Setting LLAMA_HOST puts the app in
      # "remote mode": it connects to host.docker.internal:8080 instead of trying
      # to launch a local llama-server.
      #
      #   host:  llama-server -m models/your-model.gguf --port 8080
      #   then:  docker compose up
      - LLAMA_HOST=host.docker.internal
      - LLAMA_PORT=8080
      # Optional: absolute path to llama-server (only used by setup checks, or
      # when running llama.cpp INSIDE the container with GPU passthrough below).
      #- LLAMA_SERVER=/usr/bin/llama-server
      # ── ComfyUI (optional — run it on the host, or skip and use cloud models) ──
      #- COMFYUI_URL=http://host.docker.internal:8188
    # GPU passthrough IF you want llama.cpp inside the container (requires the
    # image to include llama-server + NVIDIA Container Toolkit). Otherwise stick
    # with the host llama-server approach above — it's the simplest and fastest.
    #deploy:
    #  resources:
    #    reservations:
    #      devices:
    #        - driver: nvidia
    #          count: all
    #          capabilities: [gpu]
    restart: unless-stopped

  # Optional: run Ollama alongside the app (uncomment if you want)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ./ollama_data:/root/.ollama
  #   restart: unless-stopped

# (No separate SQLite volume — we bind-mount ../sqlite_data so the container
# shares the host's actual databases.)