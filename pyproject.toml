[project]
name = "trioforge"
version = "1.6.0"
description = "Your own private, free AI workspace — chat, notes, and corkboard with local + API models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ── Core web app ──
    "flask>=3.1.3",
    "flask-compress>=1.25",
    "requests>=2.34.2",
    # Security floors for transitive deps (mirror requirements.txt so a re-lock
    # cannot drift back below the patched releases): requests carries urllib3,
    # flask carries werkzeug. Held explicit so uv.lock resolves fixed versions.
    "urllib3>=2.8.0",
    "werkzeug>=3.1.9",

    # ── Servers ──
    "waitress==3.0.2",                       # Windows / macOS HTTPS server
    "gunicorn==26.0.0; sys_platform != 'win32'",  # Linux / Docker server

    # ── LLM providers ──
    "groq>=1.7.0",                           # Groq provider (SDK)
    # <2 is deliberate: sentence-transformers (the optional semantic stack) needs
    # huggingface-hub <2, so an open floor here lets a re-lock pick 2.x and break it.
    "huggingface_hub>=0.16.0,<2.0.0",        # Hugging Face provider
    "google-genai>=2.29.0",                  # Gemini provider (chat + image + video)

    # ── File / PDF parsing ──
    "pypdf>=6.20.0",                         # PDF text extraction (uploaded PDFs)

    # ── Notes (Obsidian-style frontmatter) ──
    # python-frontmatter (its import name is still `frontmatter`): the older
    # `frontmatter` package hard-pins PyYAML==5.1, which has no wheels for
    # Python 3.12+ and must be compiled, breaking every fresh install.
    "python-frontmatter>=1.3.0",

    # ── Performance / utilities ──
    "orjson>=3.13.0",                        # faster JSON (falls back to std json)
    "psutil>=7.2.2",                         # RAM / VRAM live monitor
    "pynvml>=13.0.1",                        # NVIDIA GPU monitoring
    "duckduckgo-search>=8.1.1",              # optional web search

    # ── Voice output ──
    # py/neural_voice.py lists ~316 neural voices and renders MP3 for the
    # read-aloud button; Windows alone only ever offers its three SAPI voices.
    # Imported lazily, so a machine without it still runs and the picker falls
    # back to the PC voices. Mirrors requirements.txt.
    "edge-tts>=7.2.7,<8.0.0",

    # ── Memory vault ──
    # py/memory.py: durable facts in a DuckDB file behind a Bloom filter gate
    # held in RAM. Imported lazily, so a missing duckdb degrades to a clear
    # message instead of an ImportError.
    "duckdb>=1.5.6",
]

[dependency-groups]
# Optional extras. Install with:  uv sync --group semantic
semantic = [
    # Semantic search / embeddings (the app runs without these).
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
]

# Image generation now runs through ComfyUI (see py/comfyui_service.py), so the
# old Diffusers stack (torch/diffusers/transformers/...) is no longer a dependency.
