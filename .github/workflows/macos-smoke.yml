name: macOS smoke test

# Actually runs the app on macOS (Apple Silicon) so you don't need a Mac to verify
# it works. macos-14 / macos-latest runners are arm64 (M-series).
#
# Run it from GitHub → Actions → "macOS smoke test" → Run workflow.
# It is free for public repos.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  macos-arm64:
    runs-on: macos-14          # Apple Silicon (arm64) — the real Apple case
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Show platform (expect Darwin / arm64)
        run: |
          uname -a
          python3 -VV
          python3 -c "import platform; print('system =', platform.system(), '| machine =', platform.machine())"

      # ── 1. Exactly what run.sh does: venv + core deps ──
      - name: Create venv and install core deps
        run: |
          set -e
          python3 -m venv .venv-linux
          .venv-linux/bin/python -m pip install --upgrade pip
          .venv-linux/bin/python -m pip install -r requirements.txt

      - name: Verify the run.sh critical-import contract
        run: |
          set -e
          for m in flask flask_compress requests psutil frontmatter; do
            .venv-linux/bin/python -c "import $m" && echo "ok: $m"
          done

      # ── 2. macOS-specific logic (Metal, brew paths, no CUDA, http scheme) ──
      - name: macOS platform-logic checks
        run: |
          set -e
          PYTHONPATH=py .venv-linux/bin/python - <<'PY'
          import platform
          assert platform.system() == "Darwin", "not running on macOS: %s" % platform.system()

          import setup_check as sc
          sc._gpu_cache = None
          gpu = sc._gpu_backend()
          print("detected gpu:", gpu)
          assert gpu["backend"] == "metal", gpu          # Apple Silicon -> Metal
          assert "Metal" in sc._llamacpp_install_hint(gpu), "llama.cpp hint lacks Metal"
          assert "brew" in sc._llamacpp_install_hint(gpu), "llama.cpp hint lacks brew"
          assert "macOS" in sc._comfyui_install_hint(gpu), "ComfyUI hint lacks macOS"

          import app
          asset = app._mkcert_asset_name()
          print("mkcert asset:", asset)
          assert "darwin" in asset and asset.endswith("-arm64"), asset

          import llama_installer as li
          names = ["llama-b10874-bin-macos-arm64.tar.gz",
                   "llama-b10874-bin-ubuntu-x64.tar.gz",
                   "llama-b10874-bin-win-cpu-x64.zip"]
          picked = li._pick_asset(names, "metal")
          print("llama.cpp asset:", picked)
          assert picked == "llama-b10874-bin-macos-arm64.tar.gz", picked

          # Apple-Silicon Homebrew lives in /opt/homebrew (NOT /usr/local), so the
          # resolver MUST search it or `brew install llama.cpp` is never found.
          # Print what it actually searches, so a failure here is self-explaining.
          import inspect, llamacpp_service as lcs
          src = inspect.getsource(lcs._resolve_llama_server_exe)
          searched = [ln.strip() for ln in src.splitlines() if ln.strip().startswith('"')]
          print("resolver searches:", searched[:6])
          assert "/opt/homebrew/bin" in src, (
              "resolver does not search /opt/homebrew/bin (Apple-Silicon Homebrew)")
          print("platform logic OK")
          PY

      # ── 2b. ComfyUI on macOS: install auto-detection + the full generation
      #        flow (queue -> poll -> download) against a mock ComfyUI server ──
      - name: ComfyUI detection + generation flow
        run: |
          set -e
          PYTHONPATH=py .venv-linux/bin/python - <<'PY'
          import base64, json, os, shutil, tempfile, threading
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import comfyui_service as cs

          # 1) Auto-detect a real macOS-style install (~/Library/Application Support)
          inst = os.path.join(os.path.expanduser("~"), "Library",
                              "Application Support", "ComfyUI")
          os.makedirs(os.path.join(inst, "blueprints"), exist_ok=True)
          with open(os.path.join(inst, "blueprints", "Text to Image (test).json"),
                    "w", encoding="utf-8") as f:
              f.write('{"nodes": [], "links": []}')
          cs.COMFYUI_INSTALL = ""
          found = cs.find_comfyui_install()
          print("auto-detected ComfyUI at:", found)
          assert found == inst, (found, inst)

          # 2) Drive the whole generation flow against a mock ComfyUI server
          PNG = base64.b64decode(
              "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==")
          PID = "ci-prompt-1"

          class Mock(BaseHTTPRequestHandler):
              def _j(self, o):
                  b = json.dumps(o).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(b)))
                  self.end_headers(); self.wfile.write(b)
              def do_GET(self):
                  if self.path.startswith("/system_stats"):
                      return self._j({"system": {"comfyui_version": "mock", "os": "posix"}})
                  if self.path.startswith("/history/"):
                      return self._j({PID: {"outputs": {"9": {"images": [
                          {"filename": "ci.png", "subfolder": "", "type": "output"}]}}}})
                  if self.path.startswith("/view"):
                      self.send_response(200)
                      self.send_header("Content-Type", "image/png")
                      self.send_header("Content-Length", str(len(PNG)))
                      self.end_headers(); self.wfile.write(PNG); return
                  self.send_response(404); self.end_headers()
              def do_POST(self):
                  n = int(self.headers.get("Content-Length", 0) or 0)
                  self.rfile.read(n)
                  if self.path.startswith("/prompt"):
                      return self._j({"prompt_id": PID})
                  self.send_response(404); self.end_headers()
              def log_message(self, *a):
                  pass

          srv = HTTPServer(("127.0.0.1", 18188), Mock)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          cs.COMFYUI_URL = "http://127.0.0.1:18188"

          assert cs.detect_comfyui()["running"] is True, "mock server not detected"
          out = os.path.join(tempfile.mkdtemp(), "result.png")
          cs.run_prompt({"9": {"class_type": "SaveImage", "inputs": {}}}, out)
          assert os.path.getsize(out) == len(PNG), "downloaded file mismatch"
          srv.shutdown()
          shutil.rmtree(inst, ignore_errors=True)
          print("ComfyUI checks OK (detection + queue/poll/download)")
          PY

      # ── 3. Launch the app and hit real endpoints ──
      - name: Start the app and smoke-test endpoints
        run: |
          set -e
          export TRIOFORGE_PORT=5003
          export PYTHONWARNINGS=ignore
          .venv-linux/bin/python py/app.py > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS "http://127.0.0.1:5003/" >/dev/null 2>&1 && break
            sleep 1
          done

          echo "===== app.log (tail) ====="
          tail -25 app.log

          echo "===== must be HTTP (no cert warning on macOS) ====="
          grep -q "Running with HTTP" app.log && echo "PASS: serving plain HTTP" \
            || { echo "FAIL: expected plain HTTP on macOS"; exit 1; }

          echo "===== GET / ====="
          curl -fsS "http://127.0.0.1:5003/" -o page.html
          echo "page bytes: $(wc -c < page.html | tr -d ' ')"

          echo "===== persona dropdown must be populated ====="
          grep -q "Friendly Tutor" page.html && echo "PASS: persona options baked in" \
            || { echo "FAIL: persona dropdown empty"; exit 1; }

          echo "===== icon toolbar must be its own centered row ====="
          grep -q "top-bar-icons" page.html && echo "PASS: icon toolbar present" \
            || { echo "FAIL: icon toolbar missing"; exit 1; }

          echo "===== GET /api/personas ====="
          curl -fsS "http://127.0.0.1:5003/api/personas"
          echo

          echo "===== GET /api/setup/check ====="
          curl -fsS "http://127.0.0.1:5003/api/setup/check" | head -c 600
          echo

          echo "ALL MACOS CHECKS PASSED"

      - name: Upload app log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-app-log
          path: app.log
          if-no-files-found: ignore
