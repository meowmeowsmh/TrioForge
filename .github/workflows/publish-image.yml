name: Publish container image

# Builds docker/Dockerfile and pushes it to GHCR so anybody can run TrioForge
# with a single `docker run` — no clone, no Python, no build step.
#
# NOTE: GitHub Container Registry packages are created PRIVATE by default, even
# for a public repo. Make it public once (repo → Packages → trioforge →
# Package settings → Change visibility → Public) so strangers can pull it.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/meowmeowsmh/trioforge

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          # Image names must be lowercase; the repo name is not.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=TrioForge
            org.opencontainers.image.description=Self-hosted AI workspace: local chat, notes and a corkboard
            org.opencontainers.image.source=https://github.com/meowmeowsmh/TrioForge
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          docker run -d --name tf-smoke -p 5099:5001 "$IMAGE:latest" || exit 1
          for i in $(seq 1 40); do
            sleep 3
            if curl -fsS http://127.0.0.1:5099/api/ping | grep -q trioforge; then
              echo "image serves /api/ping correctly"
              docker rm -f tf-smoke
              exit 0
            fi
          done
          echo "image did not answer /api/ping in time — logs:"
          docker logs tf-smoke
          docker rm -f tf-smoke
          exit 1

      - name: One-line run instructions
        run: |
          {
            echo "### Image: \`$IMAGE:latest\`"
            echo ""
            echo '```bash'
            echo "docker run -d --name trioforge -p 5002:5001 \\"
            echo "  --add-host host.docker.internal:host-gateway \\"
            echo "  -e OLLAMA_BASE_URL=http://host.docker.internal:11434 \\"
            echo "  -v trioforge-data:/app/sqlite_data \\"
            echo "  -v trioforge-config:/app/json_configuration \\"
            echo "  $IMAGE:latest"
            echo '```'
            echo ""
            echo "Then open http://localhost:5002"
          } >> "$GITHUB_STEP_SUMMARY"
