name: Python version matrix

# Runs the regression suite across the Python range the project claims to support,
# so "requires-python >=3.12" is a statement CI proves rather than a hope.
#
# Deliberately separate from the smoke workflows: those exercise the REAL entry
# points (run.sh / TrioForge-Web.bat / the launcher) on each OS. This one only asks
# "does the code actually work on this interpreter?" across the supported range.
# 3.12 is the declared floor and what the Docker image ships, 3.13 sits between,
# and 3.14 is the newest stable with full wheel coverage. 3.15/3.16 are added here
# the day their wheels land (see the one-liner in the README's Python section).
#
# 3.10 was dropped as the floor when it reached end-of-life and 3.11 is
# security-only maintenance; neither is tested any more, on purpose.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Regression suite
        run: python tests/regress.py

      - name: Version marker
        run: |
          python -c "import sys; print('tested on Python', sys.version.split()[0])"
