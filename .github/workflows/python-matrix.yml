name: Python version matrix

# Runs the regression suite across the Python range the project claims to support,
# so "requires-python >=3.10" is a statement CI proves rather than a hope.
#
# Deliberately separate from the smoke workflows: those exercise the REAL entry
# points (run.sh / TrioForge.bat / the launcher) on each OS. This one only asks
# "does the code actually work on this interpreter?" across the supported range.
# 3.10 is the declared floor, 3.12 is what the Docker image ships, 3.14 is the
# newest stable with full wheel coverage. 3.15 is added here the day its wheels
# land (see the one-liner in the README's Python section).

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Regression suite
        run: python tests/regress.py

      - name: Version marker
        run: |
          python -c "import sys; print('tested on Python', sys.version.split()[0])"
