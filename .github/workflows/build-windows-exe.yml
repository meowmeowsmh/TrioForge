name: Build Windows launcher (application.exe)

# Produces a small application.exe bootstrap (not a bundle: it clones/updates the
# app and hands over to py/tools/launcher.py). Named after application.bat so the
# Windows entry point is the same word everywhere. Attached to a Release on tags.
#
# NOTE: the exe is unsigned, so Windows SmartScreen will say "Windows protected
# your PC" the first time. Signing needs a code-signing certificate; until then
# users click "More info -> Run anyway", or install from a git clone / Docker.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build application.exe (windowed, no console) and application-cli.exe
        run: |
          pyinstaller --onefile --name application --noconsole --paths py/tools py/tools/application_exe.py
          pyinstaller --onefile --name application-cli --console --paths py/tools py/tools/application_exe.py

      - name: Smoke-test both exes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:TEMP\tf-exe-test" | Out-Null
          git clone --depth 1 https://github.com/meowmeowsmh/TrioForge.git "$env:TEMP\tf-exe-test\TrioForge"
          & .\dist\application-cli.exe --dir "$env:TEMP\tf-exe-test\TrioForge" --status
          if ($LASTEXITCODE -ne 0) { Write-Error "application-cli.exe --status failed"; exit 1 }
          # the windowed build must report status without needing a console
          & .\dist\application.exe --dir "$env:TEMP\tf-exe-test\TrioForge" --status --no-pause
          if ($LASTEXITCODE -ne 0) { Write-Error "application.exe --status failed"; exit 1 }
          # and its PE subsystem must be GUI (2), not console (3)
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\dist\application.exe")
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          Write-Host "application.exe PE subsystem = $subsystem (2 = windowed, 3 = console)"
          if ($subsystem -ne 2) { Write-Error "application.exe is a console app - it must be windowed"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: application-exe
          path: |
            dist/application.exe
            dist/application-cli.exe
          if-no-files-found: error

      - name: Attach the exes to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/application.exe
            dist/application-cli.exe
          body: |
            ## Windows

            ### The repo way - no console, no exe, just your app

            `git clone` the repo, then double-click **`start.vbs`**. The only thing that appears
            is TrioForge's own window (TrioForge in the title bar, no tabs, no address bar) with
            chat, notes and the corkboard inside it. The server runs hidden; `start.bat` does the
            same from a terminal.

            ### The one-file way

            Download `application.exe` and double-click it - a control panel hosts the app and
            TrioForge opens in its own window. No Python, no terminal, no git.

            **Seeing "Windows protected your PC"?** That is SmartScreen warning about an *unsigned*
            app, not a virus report: TrioForge has no code-signing certificate (they cost money every
            year). Click **More info → Run anyway**, or avoid the dialog completely - this downloads
            it without a browser, so Windows never marks it as "from the internet":

            ```powershell
            irm https://raw.githubusercontent.com/meowmeowsmh/TrioForge/main/install.ps1 | iex
            ```

            It listens on `127.0.0.1` only (no firewall prompt, nothing exposed on your network), and
            starting it twice attaches to the running copy instead of starting a second one.

            ### If a model does not start

            TrioForge refuses to load a model that cannot fit in your free memory instead of thrashing
            the machine. Pick a smaller GGUF, or use Ollama, which can offload to the GPU.
            `TRIOFORGE_SKIP_RAM_CHECK=1` overrides the check.

            ### Hosting it for other people

            `application-cli.exe --host` (or the hosting checkbox in the control panel) opens it to
            your network **and** puts a password in front of it, then prints the links to share.

            ### Command line

            `application-cli.exe`: `--status`, `--update`, `--install-autostart`, `--host`, `--host-password`.

            ### Docker / NAS / Linux / macOS

            `docker run … ghcr.io/meowmeowsmh/trioforge:latest`, or `git clone` and `./run.sh`.

